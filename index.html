<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My WebApp · 집콕</title>
  <style>
    :root { --bg:#0f1115; --card:#171a21; --accent:#ff7a59; --text:#e9edf4; --muted:#9aa3b2; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
           background:var(--bg); color:var(--text); min-height:100vh;
           display:flex; align-items:center; justify-content:center; padding:24px; }
    .card { background:var(--card); border:1px solid #232834; border-radius:20px;
            max-width:520px; width:100%; padding:44px 36px; text-align:center;
            box-shadow:0 20px 60px rgba(0,0,0,.4); }
    .badge { display:inline-block; font-size:13px; color:var(--accent); font-weight:700;
             letter-spacing:.5px; margin-bottom:18px; }
    h1 { font-size:30px; line-height:1.3; margin-bottom:14px; }
    p { color:var(--muted); font-size:16px; line-height:1.7; margin-bottom:28px; }
    .btn { display:inline-block; background:var(--accent); color:#1a1205; font-weight:700;
           text-decoration:none; padding:14px 28px; border-radius:12px; font-size:16px;
           transition:transform .15s ease; }
    .btn:active { transform:scale(.96); }
    .foot { margin-top:30px; font-size:13px; color:#5b6372; }
    .dot { display:inline-block; width:8px; height:8px; border-radius:50%;
           background:#38d39f; margin-right:6px; vertical-align:middle; }
  </style>
</head>
<body>
  <main class="card">
    <span class="badge">LIVE · GitHub Pages</span>
    <h1>첫 웹앱이 실제로 배포됐어요 🎉</h1>
    <p>
      이 페이지는 <strong>commerce-netizen/my-webapp</strong> 저장소에서<br />
      실제 인터넷 주소로 배포된 사이트입니다.<br /><br />
      이제 폰 Claude 앱에서 이 저장소를 열고<br />
      "제목을 OO로 바꿔줘" 처럼 채팅만 하면<br />
      내용이 자동으로 업데이트됩니다.
    </p>
    <a class="btn" href="https://github.com/commerce-netizen/my-webapp" target="_blank">저장소 보기</a>
    <div class="foot"><span class="dot"></span>배포 상태: 정상 · 수정은 채팅으로</div>
  </main>
</body>
</html>
